version: '3.8'

services:
  cryonav-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=true
      - LOG_LEVEL=INFO
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Add a simple frontend service later
  # cryonav-frontend:
  #   build: ../cryonav-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - cryonav-api